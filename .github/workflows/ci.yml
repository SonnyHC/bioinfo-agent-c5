name: Validate C5 workbench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run setup:python
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:cloud
      - run: npm run build:desktop-web
      - run: npm run test:desktop
      - run: npm run test:python
      - run: npm test
      - run: npm run test:plugin
